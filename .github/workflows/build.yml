name: Build Veil Browser

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default token is read-only — explicitly grant write for releases
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            .svelte-kit
          key: ${{ matrix.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ matrix.os }}-pnpm-

      # ─── Linux system dependencies (WebKitGTK) ───────────────────────
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            file

      # ─── Install frontend deps ───────────────────────────────────────
      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # ─── Sync SvelteKit (generates .svelte-kit/tsconfig.json) ────────
      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      # ─── Build frontend ──────────────────────────────────────────────
      - name: Build frontend
        run: pnpm build

      # ─── Build Rust backend + bundle (no release here) ───────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      # ─── Upload artifacts ────────────────────────────────────────────
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: veil-linux-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: veil-windows-x64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: veil-macos-arm64
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

  # ─── Single release job (avoids race conditions across matrix) ────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Publish Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-ci.${{ github.run_number }}
          name: Veil v0.1.0 (CI Build ${{ github.run_number }})
          body: |
            # Veil Browser — CI Build #${{ github.run_number }}

            Automated build from commit ${{ github.sha }}

            ## Downloads
            - **Linux x64**: `.deb`, `.AppImage`, `.rpm`
            - **Windows x64**: `.msi`, `.exe` (NSIS installer)
            - **macOS arm64**: `.dmg`, `.app`

            ## Notes
            - This is an automated pre-release build.
            - Built with Tauri 2.0 + Rust + SvelteKit + Brave's adblock-rust engine.
          draft: true
          prerelease: true
          files: |
            artifacts/veil-linux-x64/*
            artifacts/veil-windows-x64/*
            artifacts/veil-macos-arm64/*
