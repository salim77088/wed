name: Build Veil Browser

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: 20

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: macos-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ matrix.os }}-node-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ matrix.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # ─── Linux-specific: needed for electron-builder on Linux ────────
      - name: Install Linux deps for packaging
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libasound2

      # ─── Build & package per platform ────────────────────────────────
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Windows packages
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build macOS packages
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ─── Upload artifacts ────────────────────────────────────────────
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: veil-linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/*.rpm
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: veil-windows-x64
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: veil-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  # ─── Single release job ──────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Publish Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-ci.${{ github.run_number }}
          name: Veil v0.4.1 (CI Build ${{ github.run_number }})
          body: |
            # Veil Browser v0.4.1 — Critical Button Fixes

            Fixes the critical issue where buttons (new tab, close tab, window controls,
            hamburger menu) were not responding to clicks.

            ## Downloads
            - **Linux x64**: `.AppImage`, `.deb`, `.rpm`
            - **Windows x64**: `.exe` (NSIS), `.msi`
            - **macOS arm64**: `.dmg`

            ## What's fixed in 0.4.1
            - **New Tab (+) button now works** — was blocked by drag region
            - **Close Tab (X) button now visible** — always shown on active tab
            - **Window controls (min/max/close) now work** — uses store's windowId
            - **Hamburger menu (⋮) now appears** — fixed positioning with backdrop
            - **All buttons have explicit no-drag** — prevents frameless window issues
            - **Synchronous window ID retrieval** — fixes race condition where
              windowId was null when buttons were clicked
            - **window:init sent multiple times** — ensures renderer receives it
            - **Removed fake menu items** — only working features shown
            - **Better menu positioning** — stays on screen, closes on outside click
            - **stopPropagation on all buttons** — prevents drag region interference

            ## Root cause
            On frameless windows, `-webkit-app-region: drag` makes elements
            non-clickable. The tab strip parent was draggable, and child buttons
            didn't all have explicit `no-drag`. Combined with a race condition
            where `windowId` was sometimes null, most buttons were broken.

            Built from commit ${{ github.sha }}
          draft: true
          prerelease: true
          files: |
            artifacts/veil-linux-x64/*
            artifacts/veil-windows-x64/*
            artifacts/veil-macos-arm64/*
