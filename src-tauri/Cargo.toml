[package]
name = "wed"
version = "0.1.0"
description = "Veil — Privacy-first browser for 2026"
authors = ["salim77088"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
adblock = { version = "0.9", default-features = false, features = ["content-blocking", "embedded-domain-resolver", "css-validation"] }
# Pin rmp to a version compatible with rmp-serde 0.15 (used by adblock)
rmp = "=0.8.14"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"
dirs = "5"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
