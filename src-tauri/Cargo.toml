[package]
name = "wed"
version = "0.1.0"
description = "Veil — Privacy-first browser for 2026"
authors = ["salim77088"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
once_cell = "1"
dirs = "5"
anyhow = "1"
urlencoding = "2"
# NOTE: adblock-rust (Brave's engine) will be integrated in Phase 2.
# Phase 1 uses a simpler domain HashSet approach for reliability across
# all platforms and to keep build times under 5 minutes.

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
