<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History — Veil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0d12;
      color: #eef0f4;
      font-family: "Inter", system-ui, sans-serif;
      padding: 40px;
      min-height: 100vh;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #8b94a8; margin-bottom: 32px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .search { background: #141923; border: 1px solid #252d3f; border-radius: 999px; padding: 8px 16px; width: 320px; color: #eef0f4; }
    .search:focus { outline: none; border-color: #00d9ff; }
    .btn-clear { background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
    .btn-clear:hover { background: #dc2626; }
    .group { margin-bottom: 24px; }
    .group-title { color: #8b94a8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 8px 0; border-bottom: 1px solid #252d3f; margin-bottom: 8px; }
    .item { display: flex; align-items: center; padding: 10px 12px; border-radius: 8px; cursor: pointer; gap: 12px; }
    .item:hover { background: #141923; }
    .item-favicon { width: 16px; height: 16px; border-radius: 3px; background: #252d3f; flex-shrink: 0; }
    .item-title { flex: 1; font-size: 14px; color: #eef0f4; }
    .item-url { color: #5a6378; font-size: 12px; }
    .item-time { color: #5a6378; font-size: 12px; }
    .empty { text-align: center; padding: 80px 20px; color: #5a6378; }
  </style>
</head>
<body>
  <h1>History</h1>
  <p class="subtitle">Pages you've visited, stored locally on this device only.</p>
  <div class="toolbar">
    <input type="text" id="search" class="search" placeholder="Search history..." />
    <button class="btn-clear" onclick="clearAll()">Clear all history</button>
  </div>
  <div id="list"></div>

  <script>
    const { ipcRenderer } = window.require ? window.require('electron') : null;
    // We can't use ipcRenderer directly — use window.veil API
    async function loadHistory() {
      const items = await window.veil.history.list();
      const search = document.getElementById('search').value.toLowerCase();
      const filtered = items.filter(i =>
        (i.title || '').toLowerCase().includes(search) ||
        (i.url || '').toLowerCase().includes(search)
      );
      // Group by day
      const groups = {};
      filtered.forEach(item => {
        const d = new Date(item.visitedAt);
        const today = new Date();
        const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
        let label;
        if (d.toDateString() === today.toDateString()) label = 'Today';
        else if (d.toDateString() === yesterday.toDateString()) label = 'Yesterday';
        else label = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        if (!groups[label]) groups[label] = [];
        groups[label].push(item);
      });
      const list = document.getElementById('list');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">No history items.</div>';
        return;
      }
      list.innerHTML = Object.entries(groups).map(([label, items]) => `
        <div class="group">
          <div class="group-title">${label}</div>
          ${items.map(item => `
            <div class="item" onclick="openUrl('${item.url.replace(/'/g, "\\'")}')">
              <div class="item-favicon"></div>
              <div class="item-title">${escapeHtml(item.title || item.url)}</div>
              <div class="item-url">${escapeHtml(item.url)}</div>
              <div class="item-time">${new Date(item.visitedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
    function openUrl(url) {
      window.veil.tabs.new(window.__windowId, url);
    }
    async function clearAll() {
      if (!confirm('Clear all browsing history?')) return;
      await window.veil.history.clear();
      loadHistory();
    }
    document.getElementById('search').addEventListener('input', loadHistory);
    loadHistory();
  </script>
</body>
</html>
