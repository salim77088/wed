<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab — Veil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #141518;
      --surface: #1e2024;
      --surface-hover: #25272b;
      --border: #2a2d31;
      --text: #e8eaed;
      --text-muted: #80848b;
      --accent: #4f9eff;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12vh;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(79, 158, 255, 0.06) 0%, transparent 70%),
        var(--bg);
    }

    /* Logo */
    .logo {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f9eff 0%, #2563eb 100%);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px -4px rgba(79, 158, 255, 0.4);
    }
    .logo svg { width: 28px; height: 28px; color: white; }

    /* Greeting */
    .greeting {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 36px;
    }

    /* Search bar */
    .search-wrap {
      width: 100%;
      max-width: 580px;
      margin-bottom: 48px;
      position: relative;
    }
    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 20px 0 52px;
      border-radius: 26px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.15s ease;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 0 0 3px rgba(79, 158, 255, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Shortcuts grid */
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(6, 88px);
      gap: 12px;
    }
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.12s ease;
      text-decoration: none;
    }
    .shortcut:hover { background: var(--surface); }
    .shortcut-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      transition: transform 0.12s ease;
    }
    .shortcut:hover .shortcut-icon {
      transform: scale(1.05);
      background: var(--surface-hover);
    }
    .shortcut-icon svg, .shortcut-icon img {
      width: 22px; height: 22px;
      border-radius: 4px;
    }
    .shortcut-label {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>

  <h1 class="greeting">Good day</h1>
  <p class="subtitle">Browse privately with Veil</p>

  <form class="search-wrap" id="searchForm">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      class="search-input"
      id="searchInput"
      placeholder="Search Veil or type a URL"
      autocomplete="off"
      spellcheck="false"
      autofocus
    />
  </form>

  <div class="shortcuts" id="shortcuts"></div>

  <div class="footer">Veil Browser · Privacy-first · All blocking happens locally</div>

  <script>
    const ENGINE_URL = "https://duckduckgo.com/?q=";

    // Search form
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("searchInput").value.trim();
      if (!q) return;
      const looksLikeUrl = /^https?:\/\//.test(q) || /^[\w-]+(\.[\w-]+)+/.test(q);
      const url = (looksLikeUrl && !q.includes(" "))
        ? (q.startsWith("http") ? q : "https://" + q)
        : ENGINE_URL + encodeURIComponent(q);
      window.location.href = url;
    });

    // Shortcuts
    const SHORTCUTS = [
      { name: "YouTube", url: "https://youtube.com", icon: "https://www.youtube.com/s/desktop/favicon.ico" },
      { name: "GitHub", url: "https://github.com", icon: "https://github.githubassets.com/favicons/favicon.svg" },
      { name: "Wikipedia", url: "https://wikipedia.org", icon: "https://en.wikipedia.org/static/favicon/wikipedia.ico" },
      { name: "Reddit", url: "https://reddit.com", icon: "https://www.redditstatic.com/desktop2x/img/favicon/favicon-32x32.png" },
      { name: "HN", url: "https://news.ycombinator.com", icon: "https://news.ycombinator.com/favicon.ico" },
      { name: "X", url: "https://x.com", icon: "https://abs.twimg.com/favicons/twitter.3.ico" },
      { name: "Gmail", url: "https://mail.google.com", icon: "https://www.google.com/favicon.ico" },
      { name: "Maps", url: "https://maps.google.com", icon: "https://www.google.com/favicon.ico" },
      { name: "Drive", url: "https://drive.google.com", icon: "https://www.google.com/favicon.ico" },
      { name: "ChatGPT", url: "https://chat.openai.com", icon: "https://chat.openai.com/favicon.ico" },
      { name: "Discord", url: "https://discord.com", icon: "https://discord.com/favicon.ico" },
      { name: "Twitch", url: "https://twitch.tv", icon: "https://www.twitch.tv/favicon.ico" },
    ];

    const grid = document.getElementById("shortcuts");
    SHORTCUTS.forEach(s => {
      const a = document.createElement("a");
      a.href = s.url;
      a.className = "shortcut";
      a.innerHTML = `
        <div class="shortcut-icon">
          <img src="${s.icon}" alt="" onerror="this.style.display='none';this.parentNode.style.background='var(--surface-hover)';">
        </div>
        <span class="shortcut-label">${s.name}</span>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
