<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Tab — Veil</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: radial-gradient(ellipse at top, #141923 0%, #0a0d12 100%);
        color: #eef0f4;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 12vh;
      }
      .logo {
        width: 72px; height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #00d9ff 0%, #7c5cff 100%);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 0 60px -10px rgba(0, 217, 255, 0.4);
      }
      .logo svg { width: 36px; height: 36px; }
      h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
      .subtitle { color: #8b94a8; font-size: 16px; margin-bottom: 48px; }
      .search {
        width: 100%; max-width: 640px;
        background: #141923;
        border: 1px solid #252d3f;
        border-radius: 999px;
        padding: 14px 24px;
        display: flex; align-items: center; gap: 12px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search:focus-within {
        border-color: #00d9ff;
        box-shadow: 0 0 0 4px rgba(0, 217, 255, 0.1);
      }
      .search input {
        flex: 1; background: transparent; border: none; outline: none;
        color: #eef0f4; font-size: 16px;
      }
      .shortcuts {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
        margin-top: 48px;
        max-width: 720px;
      }
      .shortcut {
        background: #141923;
        border: 1px solid #252d3f;
        border-radius: 12px;
        padding: 16px 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s;
        text-decoration: none;
        color: inherit;
        display: block;
      }
      .shortcut:hover {
        background: #1a2030;
        border-color: #3a4258;
        transform: translateY(-2px);
      }
      .shortcut .icon {
        width: 36px; height: 36px;
        border-radius: 10px;
        background: #252d3f;
        margin: 0 auto 8px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 18px;
        color: #00d9ff;
      }
      .shortcut .name { font-size: 12px; color: #b8bfcc; }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a0d12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>Veil</h1>
    <p class="subtitle">Private. Fast. Yours.</p>
    <form class="search" onsubmit="doSearch(event)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5a6378" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="q" type="text" placeholder="Search privately or type a URL" autofocus />
    </form>
    <div class="shortcuts">
      <a class="shortcut" href="https://duckduckgo.com">
        <div class="icon">D</div>
        <div class="name">DuckDuckGo</div>
      </a>
      <a class="shortcut" href="https://github.com">
        <div class="icon">G</div>
        <div class="name">GitHub</div>
      </a>
      <a class="shortcut" href="https://youtube.com">
        <div class="icon">Y</div>
        <div class="name">YouTube</div>
      </a>
      <a class="shortcut" href="https://wikipedia.org">
        <div class="icon">W</div>
        <div class="name">Wikipedia</div>
      </a>
      <a class="shortcut" href="https://reddit.com">
        <div class="icon">R</div>
        <div class="name">Reddit</div>
      </a>
      <a class="shortcut" href="https://news.ycombinator.com">
        <div class="icon">H</div>
        <div class="name">HN</div>
      </a>
    </div>
    <script>
      function doSearch(e) {
        e.preventDefault();
        const q = document.getElementById('q').value;
        if (!q.trim()) return;
        window.location.href = q.match(/^https?:\/\//) ? q : ('https://duckduckgo.com/?q=' + encodeURIComponent(q));
      }
    </script>
  </body>
</html>
